name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 4. Setup Python & Pillow for asset generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 5. Install Python dependencies
        run: pip install -r requirements.txt

      - name: 6. Install Node dependencies
        run: npm ci

      - name: 7. Run code quality & test checks
        run: npm run check

      - name: 8. Prebuild Android native project
        run: npx expo prebuild --platform android --no-install

      - name: 9. Generate high-resolution icons and drawables
        run: python scripts/generate-assets.py

      - name: 10. Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: 11. Increase Gradle JVM memory for CI lint
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.jvm.options=-Xmx2g"
            echo "org.gradle.workers.max=2"
          } >> android/gradle.properties

      - name: 12. Build APK with Gradle
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          cd android
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --build-cache --parallel
          else
            ./gradlew assembleRelease --no-daemon --build-cache --parallel -x lintVitalAnalyzeRelease
          fi

      - name: 13. Locate and stage APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          mkdir -p dist-apk
          if [ "$BUILD_TYPE" = "debug" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/NetArchitect-debug.apk
          else
            cp android/app/build/outputs/apk/release/app-release.apk dist-apk/NetArchitect-v1.0.0-release.apk
          fi
          echo "Staged APK contents:"
          ls -la dist-apk/

      - name: 14. Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetArchitect-APK
          path: dist-apk/*.apk
          retention-days: 30

      - name: 15. Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          name: NetArchitect ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
