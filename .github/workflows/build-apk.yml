name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Python & Pillow for asset generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 5. Install Python dependencies
        run: pip install -r requirements.txt

      - name: 6. Install Node dependencies
        run: npm ci

      - name: 7. Run code quality & test checks
        run: npm run check

      - name: 8. Prebuild Android native project
        run: npx expo prebuild --platform android --no-install

      - name: 9. Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: 10. Generate high-resolution icons and drawables
        run: python scripts/generate-assets.py

      - name: 11. Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: 12. Configure Gradle memory and workers for CI
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
            echo "org.gradle.workers.max=2"
            echo "org.gradle.parallel=false"
          } >> android/gradle.properties

      - name: 13. Build APK with Gradle
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          cd android
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --build-cache --console=plain --stacktrace --info
          else
            ./gradlew assembleRelease --no-daemon --build-cache --console=plain --stacktrace --info -x lintVitalAnalyzeRelease -x lintVitalReportRelease
          fi

      - name: 14. Locate and stage APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          mkdir -p dist-apk
          if [ "$BUILD_TYPE" = "debug" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/NetArchitect-debug.apk
          else
            cp android/app/build/outputs/apk/release/app-release.apk dist-apk/NetArchitect-v1.0.0-release.apk
          fi
          echo "Staged APK contents:"
          ls -la dist-apk/

      - name: 15. Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetArchitect-APK
          path: dist-apk/*.apk
          retention-days: 30

      - name: 16. Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          name: NetArchitect ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
