name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Python & Pillow for asset generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 5. Install Python dependencies
        run: pip install -r requirements.txt

      - name: 6. Install Node dependencies
        run: npm ci

      - name: 7. Run code quality, architecture, and test checks
        run: npm run check

      - name: 8. Prebuild Android native project
        run: npx expo prebuild --platform android --no-install

      - name: 8b. Verify privacy hardening in generated AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -q 'tools:node="remove"' "$MANIFEST"
          test -f android/app/src/main/res/xml/backup_rules.xml
          test -f android/app/src/main/res/xml/data_extraction_rules.xml
          echo "Verified privacy hardening manifest and backup rules."

      - name: 9. Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 10. Generate high-resolution icons and drawables
        run: python scripts/generate-assets.py

      - name: 11. Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: 12. Configure Gradle memory, ABIs, and optional release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          # Target real mobile device ABIs for release builds (drops x86/x86_64 emulator bloat).
          if [ "$BUILD_TYPE" = "release" ]; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' android/gradle.properties
            if ! grep -q '^reactNativeArchitectures=' android/gradle.properties; then
              printf "\nreactNativeArchitectures=arm64-v8a,armeabi-v7a\n" >> android/gradle.properties
            fi
          fi
          printf "\norg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m\norg.gradle.workers.max=2\norg.gradle.parallel=false\n" >> android/gradle.properties

          if [ "$BUILD_TYPE" = "release" ] && [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              printf "\nNETARCHITECT_UPLOAD_STORE_FILE=release.keystore\n"
              printf "NETARCHITECT_UPLOAD_STORE_PASSWORD=%s\n" "$ANDROID_KEYSTORE_PASSWORD"
              printf "NETARCHITECT_UPLOAD_KEY_ALIAS=%s\n" "$ANDROID_KEY_ALIAS"
              printf "NETARCHITECT_UPLOAD_KEY_PASSWORD=%s\n" "$ANDROID_KEY_PASSWORD"
            } >> android/gradle.properties

            node -e '
              const fs = require("fs");
              const p = "android/app/build.gradle";
              let src = fs.readFileSync(p, "utf8");
              if (!src.includes("NETARCHITECT_UPLOAD_STORE_FILE")) {
                src = src.replace(
                  /signingConfigs\s*\{/,
                  `signingConfigs {\n        release {\n            if (project.hasProperty("NETARCHITECT_UPLOAD_STORE_FILE")) {\n                storeFile file(NETARCHITECT_UPLOAD_STORE_FILE)\n                storePassword NETARCHITECT_UPLOAD_STORE_PASSWORD\n                keyAlias NETARCHITECT_UPLOAD_KEY_ALIAS\n                keyPassword NETARCHITECT_UPLOAD_KEY_PASSWORD\n            }\n        }`
                );
                src = src.replace(
                  /(release\s*\{[\s\S]*?)signingConfig signingConfigs\.debug/,
                  "$1signingConfig signingConfigs.release"
                );
                fs.writeFileSync(p, src, "utf8");
              }
            '
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            echo "Configured production release keystore signing."
          else
            echo "RELEASE_SIGNED=false" >> "$GITHUB_ENV"
            echo "::notice title=Debug-signed release APK::ANDROID_KEYSTORE_* secrets are not set; falling back to debug keystore for sideloading."
          fi

      - name: 13. Build APK with Gradle
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          mkdir -p "$RUNNER_TEMP/gradle-logs"
          cd android
          set -o pipefail
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --build-cache --console=plain --stacktrace --info 2>&1 | tee "$RUNNER_TEMP/gradle-logs/build.log"
          else
            ./gradlew assembleRelease --no-daemon --build-cache --console=plain --stacktrace --info -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease 2>&1 | tee "$RUNNER_TEMP/gradle-logs/build.log"
          fi

      - name: 13b. Surface the Gradle failure reason
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle-logs/build.log"
          emit() {
            printf '::error title=%s::%s\n' "$1" \
              "$(printf '%s' "$2" | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/::/: :/g' | cut -c1-900)"
          }
          {
            echo "## Gradle build failure"
            echo
            echo '```'
            tail -n 150 "$LOG" 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          if [ ! -f "$LOG" ]; then
            emit "Gradle log missing" "No build log was written to $LOG"
          else
            TOTAL=$(wc -l < "$LOG")
            emit "Gradle log" "bytes=$(wc -c < "$LOG") lines=$TOTAL"
            if [ ! -s "$LOG" ]; then
              emit "Gradle log empty" "Gradle wrote nothing to stdout or stderr."
            fi
            START=$(grep -n "FAILURE: Build failed" "$LOG" | tail -1 | cut -d: -f1)
            if [ -n "$START" ]; then
              FROM=$(( START > 3 ? START - 3 : 1 ))
              emit "Failure banner" "line $START of $TOTAL"
              sed -n "${FROM},${TOTAL}p" "$LOG" | head -n 45 | while IFS= read -r line; do
                emit "Gradle failure" "$line"
              done
            else
              emit "No failure banner" "No 'FAILURE: Build failed' line in the log; emitting the tail instead."
              tail -n 45 "$LOG" | while IFS= read -r line; do
                emit "Gradle failure" "$line"
              done
            fi
          fi
          emit "Runner disk" "$(df -h "$RUNNER_TEMP" | tail -n 1)"
          emit "Runner memory" "$(free -m | sed -n '2p')"

      - name: 14. Locate and stage APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          PKG_VER=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v${PKG_VER}-${GITHUB_SHA:0:7}"
          fi
          mkdir -p dist-apk
          if [ "$BUILD_TYPE" = "debug" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist-apk/NetArchitect-${VERSION}-debug.apk"
          elif [ "${RELEASE_SIGNED}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/NetArchitect-${VERSION}-release.apk"
          else
            cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/NetArchitect-${VERSION}-release-debugsigned.apk"
          fi
          echo "Staged APK contents:"
          ls -la dist-apk/

      - name: 15. Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetArchitect-APK
          path: dist-apk/*.apk
          retention-days: 30

      - name: 16. Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          name: NetArchitect ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
