name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Python & Pillow for asset generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 5. Install Python dependencies
        run: pip install -r requirements.txt

      - name: 6. Install Node dependencies
        run: npm ci

      - name: 7. Run code quality & test checks
        run: npm run check

      - name: 8. Prebuild Android native project
        run: npx expo prebuild --platform android --no-install

      - name: 9. Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        # No `with:` block. The previous `build-root-directory: android` was not a
        # valid input for this action - v4 rejected it by name and listed every
        # input it does accept, none of which was that one. An unknown input makes
        # the step fail validation, so the cache was never configured and every
        # run rebuilt all four ABIs of C++ from cold. That is what turned a
        # routine build into a 22-minute one, which is where the memory pressure
        # that step 13 dies under comes from.
        #
        # setup-gradle finds the Gradle user home and the project cache on its
        # own; there is nothing to point it at.

      - name: 10. Generate high-resolution icons and drawables
        run: python scripts/generate-assets.py

      - name: 11. Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: 12. Configure Gradle memory and workers for CI
        run: |
          printf "\norg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m\norg.gradle.workers.max=2\norg.gradle.parallel=false\n" >> android/gradle.properties

      - name: 13. Build APK with Gradle
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          mkdir -p "$RUNNER_TEMP/gradle-logs"
          cd android
          # `pipefail` is not set by default in a bare `run:` block on GitHub, so
          # without this the `tee` below would swallow Gradle's exit status and
          # this step would report success on a failed build.
          set -o pipefail
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --build-cache --console=plain --stacktrace --info 2>&1 | tee "$RUNNER_TEMP/gradle-logs/build.log"
          else
            # lintVitalRelease must be excluded too, not just its two children.
            # It is the umbrella task that assembleRelease depends on, and it
            # declares returnValueInputFile as the output of lintVitalReportRelease.
            # Excluding only the children leaves the parent running with a file
            # that is never produced, which fails at configuration time:
            #   property 'returnValueInputFile' specifies file
            #   '.../lint_vital_return_value/release/lintVitalReportRelease/return-value-release.txt'
            #   which doesn't exist.
            # All three are listed so the whole lint-vital subtree across the 13
            # modules is skipped rather than running 13 analysis tasks whose only
            # consumer was excluded.
            ./gradlew assembleRelease --no-daemon --build-cache --console=plain --stacktrace --info -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease 2>&1 | tee "$RUNNER_TEMP/gradle-logs/build.log"
          fi

      - name: 13b. Surface the Gradle failure reason
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle-logs/build.log"
          # Annotations - not the job summary - are the channel here. The logs API
          # and the summary are both unreadable without authenticating, even for a
          # public repository, but
          #   GET /repos/{owner}/{repo}/check-runs/{id}/annotations
          # answers unauthenticated. A run that reports only "Process completed
          # with exit code 1" is undiagnosable, which is the condition the three
          # previous fix attempts were made under.
          #
          # The previous version of this step grepped for known failure strings
          # (FAILURE:, What went wrong, OOM, ninja:). It emitted nothing, which
          # proves the build died without printing any of them - so matching on
          # expected strings was the wrong shape. This version is pattern-free: it
          # reports the tail of the log whatever it contains, including the case
          # where the log is empty.
          emit() {
            printf '::error title=%s::%s\n' "$1" \
              "$(printf '%s' "$2" | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/::/: :/g' | cut -c1-900)"
          }
          {
            echo "## Gradle build failure"
            echo
            echo '```'
            tail -n 150 "$LOG" 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          if [ ! -f "$LOG" ]; then
            emit "Gradle log missing" "No build log was written to $LOG"
          else
            TOTAL=$(wc -l < "$LOG")
            emit "Gradle log" "bytes=$(wc -c < "$LOG") lines=$TOTAL"
            if [ ! -s "$LOG" ]; then
              emit "Gradle log empty" "Gradle wrote nothing to stdout or stderr."
            fi
            # Anchored on the last "FAILURE:" rather than a fixed tail. Gradle
            # prints FAILURE:, then "* What went wrong:", then the failing task,
            # then the exception, and only then -- with --stacktrace -- the stack
            # frames. That trace runs to tens of lines, so tail -n 15 captured the
            # frames and the "BUILD FAILED" summary while pushing the task name
            # out of the window. The task name is the whole answer, so start at
            # the banner and read forward.
            START=$(grep -n "FAILURE: Build failed" "$LOG" | tail -1 | cut -d: -f1)
            if [ -n "$START" ]; then
              FROM=$(( START > 3 ? START - 3 : 1 ))
              emit "Failure banner" "line $START of $TOTAL"
              sed -n "${FROM},${TOTAL}p" "$LOG" | head -n 45 | while IFS= read -r line; do
                emit "Gradle failure" "$line"
              done
            else
              emit "No failure banner" "No 'FAILURE: Build failed' line in the log; emitting the tail instead."
              tail -n 45 "$LOG" | while IFS= read -r line; do
                emit "Gradle failure" "$line"
              done
            fi
          fi
          # A 4-ABI new-architecture build is large enough to hit the runner's
          # disk or memory ceiling, and neither produces a Gradle failure banner.
          # Both are cheap to rule out while reading the same output.
          emit "Runner disk" "$(df -h "$RUNNER_TEMP" | tail -n 1)"
          emit "Runner memory" "$(free -m | sed -n '2p')"

      - name: 14. Locate and stage APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          mkdir -p dist-apk
          if [ "$BUILD_TYPE" = "debug" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/NetArchitect-debug.apk
          else
            cp android/app/build/outputs/apk/release/app-release.apk dist-apk/NetArchitect-v1.0.0-release.apk
          fi
          echo "Staged APK contents:"
          ls -la dist-apk/

      - name: 15. Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetArchitect-APK
          path: dist-apk/*.apk
          retention-days: 30

      - name: 16. Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          name: NetArchitect ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
